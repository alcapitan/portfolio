name: CD - Build & Deploy

on:
  workflow_dispatch: # Permet de lancer le run à la main depuis l'onglet Actions
  workflow_run:
    workflows: ["CI - Quality Check"]
    types: [completed] # déploiement uniquement si la vérification est validé
    branches: [main, feat/setup-ci-cd]

# pour éviter qu'un même commit sur feat/setup-ci-cd n'écrase la session github  actions faite sur main
concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  # 2eme job : construire l'image et l'envoyer sur le registre
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions: # principe du moindre privilège
      contents: read # lire le code
      packages: write # écrire les packages
    steps:
      - name: Checkout code
        uses: actions/checkout@v7 # récupère le code source pour que la VM y ait accès
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4 # Connexion à l'espace de stockage Docker Github
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx # pour pouvoir utiliser le cache gha
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7 # Construit avec le Dockerfile et l'envoie sur ghcr.io
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3eme job : se connecter au serveur et mettre à jour le container
  deploy:
    needs: build-and-push # attends que le 2eme job soit terminé
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb

      - name: Configure SSH client
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CF_ID: ${{ secrets.CF_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          cat <<EOF > ~/.ssh/config
          Host $HOST
              User $USER
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking no
              ProxyCommand cloudflared access ssh --hostname %h --service-token-id $CF_ID --service-token-secret $CF_SECRET
          EOF

      - name: Deploy via SSH
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh "$HOST" bash -s <<EOF
            set -e
            cd ~/containers/portfolio/

            # Connexion au registre GitHub pour pull l'image privée
            echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

            # Mise à jour et relance propre du conteneur
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          EOF
